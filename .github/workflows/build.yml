name: Build QWRT sysupgrade

on:
  workflow_dispatch:
  push:
    branches: ["main"]

env:
  OWRT_REPO: https://github.com/kravasuper/openwrt.git
  OWRT_BRANCH: xiaomi_be7000
  OWRT_COMMIT: 790d036a
  VERSION_STRING: r20260623-790d036a
  CCACHE_MAXSIZE: 2G
  ARCH: aarch64_cortex-a73
  TARGET: qualcommbe/ipq95xx
  DEVICE: openwrt-qualcommbe-ipq95xx-xiaomi_be7000
  PROFILE: qwrt

permissions:
  contents: read

concurrency:
  group: build-qwrt
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget time

      - name: Check out the pinned OpenWrt port
        run: |
          git clone --branch "$OWRT_BRANCH" --single-branch "$OWRT_REPO" owrt
          cd owrt
          git checkout "$OWRT_COMMIT"
          echo "$VERSION_STRING" > version

      - name: Apply QWRT profile and overlay
        run: |
          cd owrt
          for p in ../repo/patches/*.patch; do
            cp "$p" target/linux/qualcommbe/patches-6.18/
          done
          for p in ../repo/patches/tree/*.patch; do
            case "$p" in
              *001-dts-be7000.patch|*003-sysupgrade-slot.patch|*005-dts-be7000-no-l2-rpm-vote.patch) continue ;;
            esac
            patch -p1 < "$p"
          done
          for p in ../repo/profiles/qwrt/patches/tree/*.patch; do
            patch -p1 < "$p"
          done
          mkdir -p files
          cp -a ../repo/overlay-files/. files/
          cp -a ../repo/profiles/qwrt/overlay-files/. files/
          chmod 0755 files/etc/uci-defaults/40_bigoverlay \
                     files/etc/init.d/be7000-bootconfirm
          cp -a ../repo/awg-feed .
          cp -a ../repo/luci-theme-nimbus package/

      - name: Pin and install package feeds
        run: |
          cd owrt
          while read -r name rev _; do
            [ -n "$name" ] || continue
            sed -i -E "s|^(src-git(-full)? $name [^ ^;]+).*$|\1^$rev|" feeds.conf.default
          done < ../repo/feeds-pins.txt
          for name in $(cut -d" " -f1 ../repo/feeds-pins.txt); do
            grep -q "^src-git\(-full\)\? $name .*\^" feeds.conf.default || {
              echo "pin for $name did not apply" >&2
              exit 1
            }
          done
          grep -q '^src-link awg ' feeds.conf.default || echo "src-link awg $PWD/awg-feed" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cd owrt
          cp ../repo/config.buildinfo .config
          sed -i \
            -e '/^CONFIG_PACKAGE_luci-app-be7000-update=/d' \
            -e '/^# CONFIG_PACKAGE_luci-app-be7000-update is not set$/d' \
            -e '/^CONFIG_SIGNED_PACKAGES=/d' \
            -e '/^# CONFIG_SIGNED_PACKAGES is not set$/d' \
            -e '/^CONFIG_SIGNATURE_CHECK=/d' \
            -e '/^# CONFIG_SIGNATURE_CHECK is not set$/d' .config
          echo '# CONFIG_PACKAGE_luci-app-be7000-update is not set' >> .config
          # This image consumes the existing signed feeds but does not publish
          # a new feed, so it needs the public trust key, not the private key.
          echo '# CONFIG_SIGNED_PACKAGES is not set' >> .config
          echo 'CONFIG_SIGNATURE_CHECK=y' >> .config
          echo 'CONFIG_DEVEL=y' >> .config
          echo 'CONFIG_CCACHE=y' >> .config
          make defconfig
          grep -q '^# CONFIG_SIGNED_PACKAGES is not set' .config
          grep -q '^CONFIG_SIGNATURE_CHECK=y' .config
          grep -q '^CONFIG_CCACHE=y' .config

      - name: Cache toolchain and sources
        uses: actions/cache@v4
        with:
          path: |
            owrt/dl
            owrt/build_dir/host*
            owrt/build_dir/toolchain*
            owrt/staging_dir/host*
            owrt/staging_dir/toolchain*
          key: owrt-${{ env.OWRT_COMMIT }}-${{ hashFiles('repo/feeds-pins.txt') }}
          restore-keys: |
            owrt-${{ env.OWRT_COMMIT }}-

      - name: Cache compiler output
        uses: actions/cache@v4
        with:
          path: owrt/.ccache
          key: ccache-${{ env.OWRT_COMMIT }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.OWRT_COMMIT }}-

      - name: Download sources
        run: cd owrt && make -j"$(nproc)" download

      - name: Build toolchain and kernel
        run: |
          cd owrt
          make -j"$(nproc)" tools/install toolchain/install || make -j1 V=s tools/install toolchain/install
          make -j"$(nproc)" target/linux/compile || make -j1 V=s target/linux/compile

      - name: Point image at the matching kernel-module feed
        run: |
          cd owrt
          VERMAGIC=$(cat build_dir/target-*/linux-*/linux-*/.vermagic)
          echo "VERMAGIC=$VERMAGIC" >> "$GITHUB_ENV"
          f=files/etc/apk/repositories.d/customfeeds.list
          sed -i "s|feed/targets/$TARGET/packages/packages.adb|feed/targets/$TARGET/$VERMAGIC/packages/packages.adb|" "$f"
          grep "feed/targets" "$f"
          {
            echo "VERSION=qwrt"
            echo "TAG=qwrt"
            echo "DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "BUILD=${{ github.run_id }}"
            echo "KERNEL=$VERMAGIC"
          } > files/etc/be7000-release
          cat files/etc/be7000-release

      - name: Build firmware
        run: cd owrt && (make -j"$(nproc)" world || make -j1 V=s world)

      - name: ccache statistics
        if: always()
        run: cd owrt && (staging_dir/host/bin/ccache -s 2>/dev/null || ccache -s 2>/dev/null || echo "no ccache binary yet")

      - name: Check the QWRT image
        run: |
          cd owrt
          img=bin/targets/$TARGET/$DEVICE-squashfs-factory.ubi
          ls -la "$img" bin/targets/$TARGET/$DEVICE-squashfs-sysupgrade.bin
          ! grep -rlE "hfdbg|HFDBG|192\.168\.11\." build_dir/target-*/root-qualcommbe/etc
          test -L build_dir/target-*/root-qualcommbe/etc/rc.d/S99be7000-bootconfirm
          grep -q 'CI_ROOTPART="rootfs"' target/linux/qualcommbe/ipq95xx/base-files/lib/upgrade/platform.sh
          ! grep -q 'fw_setenv flag_' target/linux/qualcommbe/ipq95xx/base-files/lib/upgrade/platform.sh
          ! grep -q 'fw_setenv flag_' build_dir/target-*/root-qualcommbe/etc/init.d/be7000-bootconfirm
          grep -q 'vol_name=rootfs' target/linux/qualcommbe/image/ipq95xx.mk
          dts=target/linux/qualcommbe/dts/ipq9574-be7000.dts
          grep -q 'ubi.block=0,rootfs root=/dev/ubiblock0_1' "$dts"
          ! grep -q 'ubi.mtd=overlay' "$dts"
          grep -q 'regulator_fixed_1p8' "$dts"
          ! grep -q 'mp5496_l2: l2' "$dts"
          ! test -e build_dir/target-*/root-qualcommbe/usr/sbin/be7000-update
          grep -q "option enabled '0'" build_dir/target-*/root-qualcommbe/etc/config/bigoverlay
          test -s build_dir/target-*/root-qualcommbe/etc/apk/keys/public-key.pem

      - name: Prepare sysupgrade artifact
        run: |
          mkdir -p out-qwrt
          image="owrt/bin/targets/$TARGET/$DEVICE-squashfs-sysupgrade.bin"
          cp "$image" out-qwrt/xiaomi-be7000-qwrt-squashfs-sysupgrade.bin
          cp "owrt/bin/targets/$TARGET/$DEVICE.manifest" out-qwrt/manifest.txt
          cp repo/profiles/qwrt/README.md out-qwrt/README.txt
          (cd out-qwrt && sha256sum xiaomi-be7000-qwrt-squashfs-sysupgrade.bin > sha256sums.txt)

      - name: Upload sysupgrade artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-be7000-qwrt-squashfs-sysupgrade-${{ github.run_number }}
          path: out-qwrt/*
          if-no-files-found: error
          retention-days: 14
